
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Expense Tracker</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <h1>Smart Expense Tracker</h1>
        <p>Manage your money. Track your expenses.</p>
    </header>

    <main class="container">

        <!-- Total Expense Summary -->
        <section class="summary-card">
            <h2>Total Expenses</h2>
            <h1 id="total-expense">₹0.00</h1>
            <p>Your total spending so far</p>
        </section>

        <!-- Add Expense Form -->
        <section class="expense-form-card">

            <h2>Add New Expense</h2>

            <form id="expense-form">

                <div class="form-group">
                    <label for="description">Description</label>
                    <input
                        type="text"
                        id="description"
                        placeholder="Example: Lunch"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        min="0.01"
                        step="0.01"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="category">Category</label>

                    <select id="category" required>
                        <option value="">Select category</option>
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Education">Education</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <button type="submit" id="add-btn">
                    + Add Expense
                </button>

            </form>

        </section>

        <!-- Expense History -->
        <section class="expense-history">

            <h2>Recent Expenses</h2>

            <div id="expense-list">
                <p class="empty-message">
                    No expenses added yet.
                </p>
            </div>

        </section>

    </main>

    <footer>
        <p>Smart Expense Tracker | Built with HTML, CSS & JavaScript</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
